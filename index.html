<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhanshiri, DUET Gazipur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
:root{--blue:#1b8fe3;--deep:#0a5cae;--sun:#f3ee3c;--leaf:#38a63a;--ink:#06213b;--bg:#eef7ff;--b1:#e3f3ff;--b2:#eaf9e6;--b3:#f4f8c9;--card:#ffffffee;--line:#c4e0f5;--text:#0b2a47;--mut:#48677f;--gr:#0a5cae;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#06182a;--b1:#06182a;--b2:#082a3a;--b3:#0b2a1f;--card:#0e2b46ee;--line:#1d4a70;--text:#e8f3fd;--mut:#9ebbd3;--ink:#03101c;--gr:#6cc0ff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#06182a;--b1:#06182a;--b2:#082a3a;--b3:#0b2a1f;--card:#0e2b46ee;--line:#1d4a70;--text:#e8f3fd;--mut:#9ebbd3;--ink:#03101c;--gr:#6cc0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;line-height:1.6;font-size:17px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:30}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(120deg,var(--b1),var(--b2),var(--b3),var(--b1));background-size:300% 300%;animation:shift 20s ease infinite}
@keyframes shift{50%{background-position:100% 50%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deep);color:#fff;box-shadow:0 4px 18px #0a5cae55}
.nav{max-width:1120px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;text-decoration:none;margin-right:auto}
.brand .lg{width:54px;height:54px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 3px #f3ee3c88;transition:transform .8s}.brand:hover .lg{transform:rotate(360deg)}
.badge{position:absolute;left:22px;top:20px;z-index:4;width:clamp(84px,15vw,150px);aspect-ratio:1;border-radius:50%;background:#fff;padding:5px;box-shadow:0 10px 30px #0008;animation:bob 5s ease-in-out infinite}.badge img{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.bigl{display:block;width:min(260px,70%);margin:6px auto 20px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 14px 40px #0a5cae55;animation:bob 6s ease-in-out infinite}
.flogo{width:64px;height:64px;border-radius:50%;background:#fff;padding:3px;display:block;margin:0 auto 8px}
#cv{position:absolute;inset:0}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav a,.ddb{text-decoration:none;padding:6px 14px;border-radius:99px;font:500 1rem 'Outfit',sans-serif;color:#d8ecfb;background:none;border:0;cursor:pointer;transition:background .25s,color .25s}
nav a:hover,.ddb:hover{background:#ffffff22}
nav a.on,.ddb.on{background:var(--sun);color:#0b2a47}
.dd{position:relative}
.ddm{position:absolute;top:100%;left:0;min-width:190px;background:var(--deep);border-radius:14px;padding:6px;display:none;flex-direction:column;box-shadow:0 10px 30px #0006;animation:drop .25s}
.dd.open .ddm,.dd:hover .ddm,.dd:focus-within .ddm{display:flex}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{max-width:1120px;margin:auto;padding:0 18px 60px}
.view{animation:enter .6s}
@keyframes enter{from{opacity:0;transform:translateX(30px)}}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:1.9rem;margin:40px 0 6px;color:var(--gr)}
.sub{color:var(--mut);margin:0 0 20px}
.rv{opacity:0;transform:translateY(26px) scale(.97);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
/* hero slider */
.hero{position:relative;margin-top:22px;border-radius:28px;overflow:hidden;aspect-ratio:16/8;min-height:300px;box-shadow:0 20px 50px #0a5cae44}
.track{display:flex;height:100%;transition:transform .6s cubic-bezier(.7,0,.2,1)}
.slide{min-width:100%;height:100%;position:relative;background-size:cover;background-position:center;overflow:hidden}
.slide .im{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 9s ease-out infinite alternate}
@keyframes kb{to{transform:scale(1.12)}}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#04223dd9)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:26px 30px 40px;color:#fff}
.cap h1{font-size:clamp(2.2rem,7vw,4.6rem);font-weight:800;letter-spacing:-.02em}
.cap h1 b{color:var(--sun)}
.cap p{margin:6px 0 0;font-size:1.15rem;max-width:30em;animation:enter 1s}
.arr{position:absolute;top:50%;z-index:3;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:#ffffffcc;color:#0a5cae;font-size:1.4rem;cursor:pointer;transition:transform .2s}
.arr:hover{transform:translateY(-50%) scale(1.12)}
.arr.l{left:14px}.arr.r{right:14px}
.dots{position:absolute;right:26px;bottom:18px;z-index:3;display:flex;gap:8px}
.dots button{width:11px;height:11px;border-radius:9px;border:0;background:#ffffff88;padding:0;cursor:pointer;transition:width .3s,background .3s}
.dots button.on{background:var(--sun);width:30px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:22px}
.stat{background:var(--blue);color:#fff;border-radius:18px;padding:16px;text-align:center;animation:pulse 4s ease-in-out infinite}
.stat:nth-child(2){background:var(--leaf);animation-delay:-1s}.stat:nth-child(3){background:var(--deep);animation-delay:-2s}.stat:nth-child(4){background:#c9c200;color:#1c2a00;animation-delay:-3s}
.stat{display:block;text-decoration:none;color:#fff;cursor:pointer;transition:box-shadow .25s,opacity .7s,transform .7s}.stat:hover,.stat:focus-visible{box-shadow:0 12px 28px #0a5cae66}.stat em{display:block;font-style:normal;font-size:.88rem;opacity:.9;margin-top:2px}.stat b{display:block;font-size:2.3rem;font-weight:800;line-height:1.1}
@keyframes pulse{50%{transform:translateY(-5px)}}
/* cards */
.leaders{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.leader{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;border-left:8px solid var(--leaf);backdrop-filter:blur(8px)}
.leader:nth-child(2){border-left-color:var(--sun)}
.leader img{width:140px;height:140px;border-radius:50%;object-fit:cover;flex:none;border:4px solid var(--blue);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px #1b8fe333}}
.role{color:var(--leaf);font-weight:700}
.leader h3{font-size:1.4rem}
.leader small,.person small{color:var(--mut);display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.person{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 12px;text-align:center;backdrop-filter:blur(8px);transition:transform .3s,box-shadow .3s}
.person:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 14px 30px #1b8fe340}
.person img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--blue);margin-bottom:6px}
.person b{display:block;line-height:1.3}
.tag{display:inline-block;margin-top:6px;font-size:.8rem;background:var(--sun);color:#0b2a47;border-radius:99px;padding:0 10px;font-weight:600}
.job{margin-top:8px;font-size:.88rem;background:#38a63a22;color:var(--text);border-radius:10px;padding:5px 8px;line-height:1.35}
.job::before{content:"💼 "}
.leader .soc{justify-content:flex-start;margin-top:10px}.leader .si{width:36px;height:36px}
@media(max-width:760px){.leader .soc{justify-content:center}}
.soc{display:flex;justify-content:center;gap:8px;margin-top:8px}.si{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;transition:transform .2s}.si svg{width:19px;height:19px}.si.wa{background:#25D366}.si.fb{background:#1877F2}.si:hover{transform:scale(1.18)}
@media(max-width:760px){.si{width:34px;height:34px}}
.more{margin-top:8px;text-align:left;font-size:.9rem}.more summary{cursor:pointer;color:var(--gr);font-weight:600;text-align:center}.more p{margin:6px 0}.more a{color:var(--gr);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
select,input[type=text],input[type=date],input:not([type]),textarea{font:inherit;font-size:1rem;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);min-width:150px}
textarea{width:100%;min-height:110px}
.bh{display:flex;align-items:baseline;gap:10px;margin:30px 0 4px;padding-bottom:6px;border-bottom:3px solid var(--blue)}
.bh h3{font-size:1.4rem}.bh span{color:var(--mut)}
.dh{margin:16px 0 10px;font-weight:700;color:var(--leaf)}
/* blog */
.post{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;margin-bottom:26px;backdrop-filter:blur(8px)}
.post .cv{height:280px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.post .cv i{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 6s}
.post:hover .cv i{transform:scale(1.1)}
.post .bd{padding:22px 26px 26px}
.meta{color:var(--leaf);font-weight:600;font-size:.95rem}
.post h3{font-size:1.6rem;margin:4px 0 8px}
.post .full{display:none}.post.open .full{display:block;animation:enter .5s}.post.open .sum{display:none}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.gal img{width:100%;height:190px;object-fit:cover;border-radius:14px}
.btn{background:var(--blue);color:#fff;border:0;padding:10px 22px;border-radius:99px;font:600 1rem 'Outfit',sans-serif;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:var(--deep)}
.btn.alt{background:transparent;color:var(--text);border:2px solid var(--blue)}
.btn.red{background:#d64545}
.btn.sm{padding:5px 14px;font-size:.9rem}
/* timeline */
.tl{position:relative;padding-left:34px;margin-top:10px}
.tl::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:4px;border-radius:4px;background:linear-gradient(var(--blue),var(--leaf),var(--sun));background-size:100% 300%;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:0 300%}}
.ev{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin-bottom:16px;backdrop-filter:blur(8px)}
.ev::before{content:"";position:absolute;left:-31px;top:22px;width:16px;height:16px;border-radius:50%;background:var(--sun);border:4px solid var(--blue)}
.ev img{max-width:100%;max-height:260px;border-radius:12px;margin-top:8px}
.ev h3{font-size:1.2rem}
.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.about div{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:16px;padding:18px}
.about div:nth-child(2){border-top-color:var(--leaf)}.about div:nth-child(3){border-top-color:var(--sun)}
/* admin */
.atabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.atabs button{font:600 1rem 'Outfit',sans-serif;padding:8px 18px;border-radius:12px;border:2px solid var(--blue);background:transparent;color:var(--text);cursor:pointer}
.atabs button.on{background:var(--blue);color:#fff}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.row img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis}
.form{background:var(--card);border:2px solid var(--blue);border-radius:18px;padding:18px;margin:14px 0}
.form label{display:block;font-weight:600;margin:10px 0 4px}
.form .pv{max-width:200px;max-height:140px;border-radius:12px;display:block;margin:6px 0}
.note{background:#f3ee3c55;border-radius:12px;padding:10px 14px;margin:10px 0}
footer{background:var(--ink);color:#b9d6ee;text-align:center;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));font-size:.95rem}
footer b{color:var(--sun)}
footer{position:relative}
.dev{position:absolute;right:16px;bottom:12px;text-align:left}
.dev a,.dev>div{display:flex;align-items:center;gap:10px;text-decoration:none;color:#b9d6ee;background:#ffffff14;border-radius:14px;padding:6px 12px 6px 6px;max-width:260px;transition:background .25s}
.dev a:hover{background:#ffffff26}
.dev img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--sun);flex:none}
.dev span{display:block;line-height:1.25}.dev small{display:block;font-size:.72rem;opacity:.8}.dev b{font-size:.92rem;color:#fff}
@media(max-width:760px){.dev{position:static;margin-top:14px;display:flex;justify-content:center}}
@media(max-width:760px){.leaders{grid-template-columns:1fr}.leader{flex-direction:column;text-align:center}}

/* ===== mobile ===== */
html{-webkit-text-size-adjust:100%}html,body{overflow-x:hidden}img{max-width:100%}
.menu{display:none;background:#ffffff22;color:#fff;border:0;border-radius:12px;width:46px;height:46px;font-size:1.5rem;cursor:pointer}
@media(max-width:860px){
.nav{padding:8px 14px}
.menu{display:block}
nav{display:none;width:100%;flex-direction:column;align-items:stretch;gap:2px;padding-bottom:8px}
nav.open{display:flex;animation:drop .25s}
nav a,.ddb{width:100%;text-align:left;padding:13px 16px;font-size:1.05rem;border-radius:12px}
.dd{width:100%}
.ddm{position:static;min-width:0;box-shadow:none;background:#ffffff14;margin:2px 0 6px 14px;animation:none}
.dd:hover .ddm,.dd:focus-within .ddm{display:none}.dd.open .ddm{display:flex}
}
@media(max-width:760px){
body{font-size:16px}
main{padding:0 14px 44px}
h2{font-size:1.55rem;margin-top:30px}
.hero{aspect-ratio:auto;height:min(70vh,480px);border-radius:20px;margin-top:14px}
.cap{padding:16px 18px 46px}.cap h1{font-size:clamp(1.9rem,9vw,2.8rem)}.cap p{font-size:1rem}
.badge{left:12px;top:12px;width:72px;padding:3px}
.arr{width:38px;height:38px;font-size:1.2rem}.arr.l{left:8px}.arr.r{right:8px}
.dots{right:16px;bottom:14px}

.person{padding:12px 8px}.person img{width:78px;height:78px}.person b{font-size:.95rem}.person small{font-size:.82rem}
.filters{gap:8px}.filters select,.filters input{flex:1 1 100%;min-width:0;width:100%}
.post .cv{height:200px}.post .bd{padding:16px}.post h3{font-size:1.35rem}.gal img{height:150px}
.tl{padding-left:26px}.ev{padding:14px}.ev::before{left:-27px}.tl::before{left:6px}
.bigl{width:170px}
.about{grid-template-columns:1fr}
.row{flex-wrap:wrap}.row .t{flex:1 1 60%}.row .btn.sm{padding:9px 16px;flex:1}
.form{padding:14px}.form input:not([type=file]),.form select,.form textarea{width:100%;min-width:0}
.atabs button{flex:1 1 45%;padding:9px 10px;font-size:.95rem}
.btn{padding:11px 22px}
}
@media(max-width:380px){.brand{font-size:1.02rem}.brand .lg{width:44px;height:44px}.grid{gap:8px}.person b{font-size:.9rem}.leader img{width:100px;height:100px}}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}

#jf{max-width:560px}#jf input:not([type=file]):not([type=checkbox]),#jf select{width:100%}
@media(max-width:760px){.srow{flex-wrap:wrap}.srow .t{flex:1 1 60%}.srow .btn.sm{flex:1;padding:9px 16px}}
.ybars{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 4px}
.yb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;cursor:pointer;color:var(--text);font:inherit;min-width:64px;transition:transform .2s}.yb:hover{transform:translateY(-4px)}
.yb i{display:block;width:26px;background:linear-gradient(var(--sun),var(--leaf),var(--blue));border-radius:6px 6px 2px 2px;transform-origin:bottom;animation:grow 1s ease-out}@keyframes grow{from{transform:scaleY(0)}}
.yh{font-size:1.8rem;margin:34px 0 14px;color:var(--gr);display:flex;align-items:center;gap:12px;flex-wrap:wrap}.yh span{font-size:.95rem;background:var(--leaf);color:#fff;border-radius:99px;padding:2px 14px;font-weight:600}
.ev2{position:relative;margin-bottom:24px}.ev2 .post{margin-bottom:0}.ev2 .dot{position:absolute;left:-31px;top:26px;width:16px;height:16px;border-radius:50%;background:var(--sun);border:4px solid var(--blue);z-index:1}
.cap p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:760px){.ev2 .dot{left:-27px}.yh{font-size:1.5rem}}

function gearPath(r1,r2,n){var d='',s=Math.PI*2/n;for(var i=0;i<n;i++){var a=i*s,p=[[a-.28*s,r1],[a-.16*s,r2],[a+.16*s,r2],[a+.28*s,r1]];p.forEach(function(q,k){d+=(i+k?'L':'M')+(Math.cos(q[0])*q[1]).toFixed(1)+' '+(Math.sin(q[0])*q[1]).toFixed(1)})}return d+'Z'}

/* ================= helpers ================= */
function av(name,i){var c=['#1b8fe3','#38a63a','#0a5cae','#2a9d8f','#c9a400'][(i||0)%5],t=(name||'?').trim().charAt(0).toUpperCase();
 return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="'+c+'"/><text x="50" y="66" font-size="48" font-family="sans-serif" text-anchor="middle" fill="#fff">'+t+'</text></svg>')}
function src(v){return v?(/^(https?:|data:|\/_blob\/)/.test(v)?v:'/_blob/'+v):''}
function pic(o,i){return src(o.image)||av(o.name,i)}
function fmt(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}}
function card(p,i,extra){return '<div class="person rv"><img src="'+esc(pic(p,i))+'" alt="'+esc(p.name)+'" loading="lazy"><b>'+esc(p.name)+'</b><small>'+esc(p.info||('Series '+p.batch+' · '+p.dept))+'</small>'+(p.role?'<span class="tag">'+esc(p.role)+'</span>':'')+(extra||'')+'</div>'}
function grad(i){var g=[['#1b8fe3','#0a5cae'],['#38a63a','#0a7a3c'],['#0a5cae','#2aa6b8'],['#2aa6b8','#38a63a']][i%4];return 'linear-gradient(135deg,'+g[0]+','+g[1]+')'}

async function checkAdmin(ses){who=ses&&ses.user?ses.user.email||'':'';rpcErr='';if(!ses||!sb){canAdmin=false;db=assets=null;SUBS=[];return}try{var r=await sb.rpc('is_admin');canAdmin=r.data===true;if(r.error)rpcErr=r.error.message}catch(e){canAdmin=false;rpcErr=String(e&&e.message||e)}db=assets=canAdmin?sb:null;if(canAdmin)await loadSubs()}
(async function(){var C=window.SITE_CONFIG||{};
 if(!window.supabase||!C.url||/YOUR_/.test(C.url)||!C.key||/YOUR_/.test(C.key)){ready=true;draw();return}
 try{sb=supabase.createClient(C.url,C.key);
  var r=await sb.from('site_data').select('json').eq('id',1).maybeSingle();
  if(r.data&&r.data.json&&Object.keys(r.data.json).length)DATA=Object.assign(sample(),r.data.json);
  var s=await sb.auth.getSession();await checkAdmin(s.data.session);
  sb.auth.onAuthStateChange(function(ev,ses){if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){setTimeout(async function(){await checkAdmin(ses);draw()},0)}})}catch(e){}
 ready=true;draw()})();
</script>
